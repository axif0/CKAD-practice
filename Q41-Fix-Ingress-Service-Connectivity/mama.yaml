apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-marlin-ingress
  namespace: content-marlin
spec:
  rules:
  - host: content-marlin.local
    http:
      paths:
      - path: /content-marlin
        pathType: Prefix
        backend:
          service:
            name: content-marlin-svc
            port:
              number: 9999