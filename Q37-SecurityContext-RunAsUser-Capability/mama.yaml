apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-deployment
  namespace: grubworm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
     securityContext:
       runAsUser: 10000
     containers:
      - name: store
        image: nginx
        ports:
        - containerPort: 80
        securityContext:
           capabilities:
              add:
               - NET_BIND_SERVICE
