apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: garfish
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: garfish
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
